<!-- Login screen, shown to any unauthenticated visitor. -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Iniciar sesión | {{ business.name|default:"Las Hamacas" }}</title>

  {% load static %}

  <!-- PWA: home-screen shortcut -->
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <meta name="theme-color" content="#c23a22">
  <link rel="apple-touch-icon" href="{% static 'pos/icons/icon-192.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hamacas">

  <link rel="stylesheet" href="{% static 'pos/base.css' %}?v=28">
</head>

<body>
  <main class="login-page">
    <div class="login-ticket">
      <div class="login-head">
        {% if business and business.logo %}
          <img class="login-logo" src="{{ business.logo.url }}" alt="{{ business.name }}">
        {% else %}
          <img class="login-logo" src="{% static 'pos/logo.png' %}" alt="{{ business.name|default:'Las Hamacas' }}">
        {% endif %}
        <div class="login-title">{{ business.name|default:"Las Hamacas" }}</div>
        <div class="kicker">Ingreso del personal</div>
      </div>

      <div class="hr"></div>

      {% if error %}
        <div class="notice err" style="margin-bottom:14px;">{{ error }}</div>
      {% endif %}

      <form method="post" action="{% url 'pos_login' %}" class="login-form">
        {% csrf_token %}

        <div>
          <label class="label" for="username">Usuario</label>
          <input class="input" id="username" name="username" autocomplete="username"
                 autocapitalize="none" required placeholder="ej: mesero1" value="{{ request.POST.username|default:'' }}"/>
        </div>

        <div>
          <label class="label" for="password">Contraseña</label>
          <div class="pass-wrap">
            <input class="input" type="password" id="password" name="password"
                   autocomplete="current-password" required/>
            <button type="button" class="pass-toggle" id="togglePass" aria-label="Mostrar contraseña">Ver</button>
          </div>
        </div>

        <button class="btn primary lg block" type="submit">Entrar</button>
      </form>

      <div class="login-foot">Red interna del restaurante</div>
    </div>
  </main>

  <script>
    (function(){
      const pass = document.getElementById("password");
      const btn = document.getElementById("togglePass");
      btn.addEventListener("click", () => {
        const show = pass.type === "password";
        pass.type = show ? "text" : "password";
        btn.textContent = show ? "Ocultar" : "Ver";
        btn.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
        pass.focus();
      });
    })();
  </script>
</body>
</html>
